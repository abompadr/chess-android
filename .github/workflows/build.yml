name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download Stockfish for Android ARM64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz" \
            -o stockfish.tar.gz
          tar -xzf stockfish.tar.gz
          find . -name "stockfish*" -type f ! -name "*.tar.gz" | head -1 | xargs -I{} cp {} app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/chess.jks

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/chess.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
